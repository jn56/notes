<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>單字卡 (Words Flashcards)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0f172a;
            --bg-mid: #1e1b4b;
            --bg-warm: #311042;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-hover: rgba(255, 255, 255, 0.13);
            --text-eng: #0f172a;
            --text-cht: #1e40af;
            --text-ipa: #64748b;
            --accent-highlight: #dc2626;
            --accent-highlight-bg: rgba(220, 38, 38, 0.08);
        }

        body {
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 18% 18%, rgba(99, 102, 241, 0.25) 0%, transparent 45%),
                        radial-gradient(circle at 82% 82%, rgba(236, 72, 153, 0.18) 0%, transparent 45%),
                        linear-gradient(135deg, #0f172a 0%, #1e1b4b 52%, #2e1065 100%);
            font-family: 'Inter', 'Noto Sans TC', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation; /* 停用點擊兩下放大，提升手機操作手感 */
            position: relative;
        }

        /* 背景環境微光裝飾 */
        body::before {
            content: "";
            position: absolute;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, transparent 70%);
            top: -140px;
            right: -100px;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: absolute;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, transparent 70%);
            bottom: -140px;
            left: -100px;
            pointer-events: none;
        }

        /* 維持原本單字卡容器大小 */
        .card-container {
            width: 800px;
            max-width: 90%;
            height: 60vh;
            min-height: 300px;
            position: relative;
            z-index: 2;
        }

        /* 卡片底部堆疊層次感 */
        .card-container::before {
            content: "";
            position: absolute;
            inset: 10px 18px -8px 18px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            filter: blur(1px);
            z-index: -1;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        /* 維持原本單字卡尺寸與內距 */
        .card {
            -webkit-tap-highlight-color: transparent;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 24px 60px rgba(2, 6, 23, 0.45),
                        0 6px 16px rgba(2, 6, 23, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.65);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 80px; /* 增加左右留白 */
            box-sizing: border-box;
            text-align: center;
            position: relative;
            cursor: pointer;
            user-select: none; /* 防止快速點擊時反白文字 */
            overflow: hidden;
        }

        /* 左右側翻頁微光提示 (僅電腦版懸停顯示) */
        @media (hover: hover) and (min-width: 601px) {
            .card::before,
            .card::after {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                font-size: 20px;
                font-weight: 600;
                color: rgba(100, 116, 139, 0.22);
                pointer-events: none;
                transition: opacity 0.25s ease, transform 0.25s ease, color 0.25s ease;
                opacity: 0;
            }
            .card::before {
                content: "‹";
                left: 22px;
            }
            .card::after {
                content: "›";
                right: 22px;
            }
            .card:hover::before {
                opacity: 1;
                transform: translate(-3px, -50%);
            }
            .card:hover::after {
                opacity: 1;
                transform: translate(3px, -50%);
            }
        }

        /* Kindle 刷頁特效樣式（完整保留） */
        .kindle-wipe-wrapper {
            position: absolute;
            inset: 0;
            border-radius: 15px;
            overflow: hidden;
            pointer-events: none;
            z-index: 5;
        }
        .card-wipe-overlay {
            position: absolute !important;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: none !important;
            margin: 0;
            pointer-events: none;
        }
        .kindle-sweep-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 28px;
            transform: translateX(-50%);
            background: linear-gradient(to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.75) 45%,
                rgba(0, 0, 0, 0.07) 55%,
                rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* 左上角階段膠囊與自動倒數計時 */
        .title {
            position: absolute;
            top: 20px;
            left: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            background: rgba(255, 255, 255, 0.68);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid rgba(15, 23, 42, 0.06);
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
        }

        .state-dot-badge {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #6366f1;
            display: inline-block;
        }

        /* 底部進度與分頁點指示器 */
        .progress {
            position: absolute;
            bottom: 18px;
            left: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            pointer-events: none;
        }

        .progress-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            color: #64748b;
            background: rgba(255, 255, 255, 0.6);
            padding: 3px 10px;
            border-radius: 999px;
            border: 1px solid rgba(15, 23, 42, 0.05);
        }

        .step-dots {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .step-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: rgba(100, 116, 139, 0.25);
            transition: all 0.25s ease;
        }

        .step-dot.active {
            width: 22px;
            background: #4f46e5;
        }

        .step-label {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            min-width: 58px;
            text-align: right;
        }

        /* 卡片最底端細進度條 */
        .bottom-progress-track {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(15, 23, 42, 0.05);
            overflow: hidden;
            pointer-events: none;
        }

        .bottom-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
            transition: width 0.3s ease;
        }

        .content {
            font-size: 32px;
            color: var(--text-eng);
            line-height: 1.5;
            white-space: pre-line;
            word-break: break-word;
            width: 100%;
            letter-spacing: -0.015em;
        }

        /* 音標膠囊樣式 */
        .ipa-badge {
            display: inline-block;
            font-family: 'JetBrains Mono', 'Segoe UI', monospace;
            color: var(--text-ipa);
            font-size: 0.48em;
            font-weight: 500;
            margin-top: 12px;
            padding: 4px 14px;
            background: rgba(15, 23, 42, 0.045);
            border: 1px solid rgba(15, 23, 42, 0.06);
            border-radius: 999px;
            letter-spacing: 0.02em;
        }

        /* 詞性小標籤 */
        .pos-badge {
            display: inline-block;
            font-family: 'Inter', sans-serif;
            font-size: 0.65em;
            font-weight: 700;
            color: #4338ca;
            background: rgba(79, 70, 229, 0.1);
            border: 1px solid rgba(79, 70, 229, 0.2);
            padding: 2px 9px;
            border-radius: 8px;
            margin-right: 10px;
            vertical-align: middle;
            letter-spacing: 0.02em;
        }

        /* 例句關鍵字高亮 */
        .kw-highlight {
            color: var(--accent-highlight);
            background: var(--accent-highlight-bg);
            padding: 1px 6px;
            border-radius: 6px;
            font-weight: 700;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        /* 中英分隔線 */
        .content-divider {
            height: 1px;
            width: 68%;
            margin: 20px auto;
            background: linear-gradient(90deg, transparent, rgba(15, 23, 42, 0.12), transparent);
        }

        /* 右上角分類標籤與發音按鈕 */
        .card-top-right {
            position: absolute;
            top: 18px;
            right: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 3;
        }

        .tag-pill {
            padding: 4px 11px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.03em;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(15, 23, 42, 0.07);
            box-shadow: 0 2px 5px rgba(15, 23, 42, 0.04);
        }
        .tag-pill.tag-Tech {
            background: rgba(224, 242, 254, 0.85);
            color: #0369a1;
            border-color: rgba(14, 165, 233, 0.2);
        }
        .tag-pill.tag-Economy {
            background: rgba(254, 243, 199, 0.85);
            color: #b45309;
            border-color: rgba(245, 158, 11, 0.22);
        }
        .tag-pill.tag-Global {
            background: rgba(243, 232, 255, 0.85);
            color: #7e22ce;
            border-color: rgba(168, 85, 247, 0.2);
        }
        .tag-pill.tag-Life {
            background: rgba(220, 252, 231, 0.85);
            color: #15803d;
            border-color: rgba(34, 197, 94, 0.2);
        }

        .speak-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid rgba(15, 23, 42, 0.08);
            background: rgba(255, 255, 255, 0.75);
            color: #334155;
            cursor: pointer;
            padding: 0;
            box-shadow: 0 2px 5px rgba(15, 23, 42, 0.05);
            transition: all 0.2s ease;
        }
        .speak-btn:hover {
            background: #ffffff;
            color: #4f46e5;
            transform: scale(1.06);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.15);
        }
        .speak-btn:active {
            transform: scale(0.95);
        }

        /* 頂部控制列：毛玻璃膠囊底座 */
        .controls-wrapper {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 7px 12px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            max-width: 94vw;
        }

        .controls-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .controls-row::-webkit-scrollbar {
            display: none;
        }

        .controls-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.16);
            margin: 0 2px;
            flex-shrink: 0;
        }

        .switch-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(226, 232, 240, 0.78);
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid transparent;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .switch-label:hover {
            background: var(--glass-hover);
            color: #ffffff;
        }

        .switch-label input[type="checkbox"] {
            display: none;
        }

        .switch-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(148, 163, 184, 0.45);
            transition: all 0.2s ease;
        }

        /* 啟用狀態 */
        .switch-label:has(input:checked) {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.9) 0%, rgba(79, 70, 229, 0.9) 100%);
            color: #ffffff;
            border-color: rgba(165, 180, 252, 0.35);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }

        .switch-label.mode-switch:has(input:checked) {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.92) 0%, rgba(217, 119, 6, 0.92) 100%);
            border-color: rgba(253, 230, 138, 0.4);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
        }

        .switch-label:has(input:checked) .switch-dot {
            background: #ffffff;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
        }

        /* 底部操作說明列 */
        .instructions {
            margin-top: 24px;
            color: rgba(226, 232, 240, 0.75);
            font-size: 13px;
            text-align: center;
            padding: 8px 18px;
            line-height: 1.6;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 2;
        }

        .kbd-key {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom-width: 2px;
            padding: 1px 6px;
            border-radius: 5px;
            margin: 0 2px;
        }

        #file-picker-container {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            padding: 36px;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        #file-picker-container h2 {
            margin-top: 0;
            color: #0f172a;
            font-size: 20px;
        }
        input[type="file"] {
            margin-top: 20px;
            font-size: 16px;
            max-width: 100%;
        }

        /* 手機版適配：當螢幕寬度小於 600px 時縮小字體與調整頂部控制列 */
        @media (max-width: 600px) {
            body {
                -webkit-tap-highlight-color: transparent;
                justify-content: flex-start;
                padding-top: 125px;
            }
            .controls-wrapper {
                top: 16px;
                flex-direction: column;
                gap: 6px;
                padding: 8px 10px;
                border-radius: 20px;
                background: rgba(15, 23, 42, 0.55);
            }
            .controls-divider {
                display: none;
            }
            .switch-label {
                padding: 5px 11px;
                font-size: 12px;
            }
            .card {
                -webkit-tap-highlight-color: transparent;
                padding: 20px 15px; /* 手機版單字卡小一點 */
                min-height: 250px;
            }
            .title {
                top: 14px;
                left: 14px;
                font-size: 11px;
                padding: 4px 10px;
            }
            .card-top-right {
                top: 13px;
                right: 14px;
                gap: 6px;
            }
            .progress {
                bottom: 12px;
                left: 14px;
                right: 14px;
                font-size: 11.5px;
            }
            .instructions {
                margin-top: 18px;
                font-size: 12px;
                padding: 6px 14px;
                gap: 10px;
                flex-wrap: wrap;
                justify-content: center;
                max-width: 88vw;
                border-radius: 14px;
            }
        }
    </style>
</head>

complimentary,Our guests said some very complimentary things about the meal I'd cooked.,adj. 讚美的；免費贈送的,我們的客人對我做的飯菜讚不絕口。,/ˌkɒmplɪ̈ˈmɛnt(ə)ɹi/,Life

    <script>
        let wordsData = [];
        let originalWordsData = [];
        let currentWordIdx = 0;
        let currentStateIdx = 0;

        const stateLabels = ["單字 Word", "例句 Context", "釋義 Meaning", "中譯 Translation"];
        
        // 精選高質感柔和紙感漸層背景，兼具溫潤視覺與極佳文字對比度
        const cardBgColors = [
            "linear-gradient(145deg, #fffdf7 0%, #fef3e8 100%)", // 暖米晨光
            "linear-gradient(145deg, #f6fdfb 0%, #eef6ff 100%)", // 冰川薄荷
            "linear-gradient(145deg, #fbf8ff 0%, #f0f5ff 100%)", // 暮霧薰衣草
            "linear-gradient(145deg, #fff9fb 0%, #feeef3 100%)", // 櫻粉微光
            "linear-gradient(145deg, #f8fdf5 0%, #ebf9f1 100%)", // 鼠尾草白
            "linear-gradient(145deg, #fffbf5 0%, #fff0eb 100%)"  // 杏桃柔光
        ];

        function parseCSV(str) {
            const arr = [];
            let quote = false;
            let row = 0;
            let col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';

                if (cc === '"' && quote && nc === '"') {
                    arr[row][col] += cc; ++c; continue;
                }
                if (cc === '"') {
                    quote = !quote; continue;
                }
                if (cc === ',' && !quote) {
                    ++col; continue;
                }
                if (cc === '\r' && nc === '\n' && !quote) {
                    ++row; col = 0; ++c; continue;
                }
                if (cc === '\n' && !quote) {
                    ++row; col = 0; continue;
                }
                if (cc === '\r' && !quote) {
                    ++row; col = 0; continue;
                }
                arr[row][col] += cc;
            }
            // 將字串中的 literal '\n' 轉換為真實換行符號，讓 CSV 可以是單行
            return arr.map(r => r.map(cell => cell.replace(/\\n/g, '\n')));
        }

        function loadCSVText(text) {
            const arr = parseCSV(text);
            wordsData = arr.filter(row => row.length >= 4 && row[0].trim() !== '');
            
            if (wordsData.length > 0 && wordsData[0][0] === '英文單字') {
                wordsData.shift(); 
            }

            originalWordsData = [...wordsData];
            if (wordsData.length > 0) {
                document.getElementById('file-picker-container').style.display = 'none';
                document.getElementById('card').style.display = 'flex';
                applyFilters(); // will call render()
            } else {
                alert("找不到單字資料或格式錯誤！");
            }
        }

        function speakCurrentText(e) {
            if (e) e.stopPropagation();
            if (!('speechSynthesis' in window) || wordsData.length === 0) return;
            const item = wordsData[currentWordIdx];
            // 在第 1、3 頁念單字，在第 2、4 頁念例句第一句
            let textToSpeak = (currentStateIdx === 0 || currentStateIdx === 2)
                ? item[0].split('/')[0].replace(/[\[\]()]/g, '').trim()
                : item[1].split('\n')[0].trim();
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(textToSpeak);
            utter.lang = 'en-US';
            utter.rate = 0.95;
            window.speechSynthesis.speak(utter);
        }

        function render() {
            if (wordsData.length === 0) return;
            const item = wordsData[currentWordIdx];
            const cardElement = document.getElementById('card');
            const cardTitle = document.getElementById('card-title');
            const cardContent = document.getElementById('card-content');
            const cardProgress = document.getElementById('card-progress');
            const bottomFill = document.getElementById('bottom-progress-fill');

            // 左上角顯示階段名稱與自動倒數計時器預留區
            cardTitle.innerHTML = `<span class="state-dot-badge"></span><span>${stateLabels[currentStateIdx]}</span><span id="auto-timer" style="display:none; margin-left:4px; color:#d97706; font-family:'JetBrains Mono',monospace;"></span>`;

            // 清空舊內容
            cardContent.innerHTML = '';
            
            function escapeHTML(str) {
                return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag));
            }

            // 輔助函數：將文字以 div 方式附加，若有多行則套用小圓點與縮排對齊
            function appendLines(container, text, color, forceNoBullet = false, highlightWord = null, parsePOS = false) {
                text = text.trim();
                const lines = text.split('\n').filter(line => line.trim() !== '');
                const useBullet = lines.length > 1 && !forceNoBullet;
                
                lines.forEach((line, idx) => {
                    const div = document.createElement('div');
                    div.style.color = color;
                    if (idx > 0) div.style.marginTop = '0.35em';
                    
                    let htmlContent = escapeHTML(line.trim());

                    // 美化詞性前綴 (如 n. / v. / adj. / phr.)
                    if (parsePOS) {
                        htmlContent = htmlContent.replace(/^((?:[a-z]+\.?\/)+[a-z]+\.|(?:n|v|adj|adv|phr|prep|conj)\.)\s*/i, '<span class="pos-badge">$1</span>');
                    }

                    if (highlightWord) {
                        const cleanWord = highlightWord.split('/')[0].trim();
                        const pattern = cleanWord.includes(' ') 
                            ? cleanWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
                            : cleanWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + "(?:s|es|d|ed|ing|ly|er|est)?";
                        const regex = new RegExp(`\\b(${pattern})\\b`, 'gi');
                        htmlContent = htmlContent.replace(regex, `<span class="kw-highlight">$1</span>`);
                    }

                    if (useBullet) {
                        div.style.display = "flex";
                        div.style.alignItems = "flex-start";
                        
                        if (currentStateIdx === 2 || currentStateIdx === 0) {
                            div.style.justifyContent = "center";
                        }
                        
                        const bullet = document.createElement('span');
                        bullet.innerHTML = '&bull;';
                        bullet.style.marginRight = '0.55em';
                        bullet.style.color = '#94a3b8';
                        bullet.style.flexShrink = '0';
                        
                        const txt = document.createElement('span');
                        txt.innerHTML = htmlContent;
                        txt.style.textAlign = "left";
                        
                        div.appendChild(bullet);
                        div.appendChild(txt);
                    } else {
                        div.innerHTML = htmlContent;
                    }
                    container.appendChild(div);
                });
            }

            const engColor = "#0f172a"; // 深邃石板黑
            const chtColor = "#1e40af"; // 質感皇家藍

            // 輔助函數：顯示單字與音標
            function displayWordWithIPA(wordText, ipaText) {
                appendLines(cardContent, wordText, engColor, true);
                if (ipaText && ipaText.trim() !== '') {
                    const ipaWrap = document.createElement('div');
                    ipaWrap.style.textAlign = "center";
                    const ipaSpan = document.createElement('span');
                    ipaSpan.className = 'ipa-badge';
                    ipaSpan.textContent = ipaText.trim();
                    ipaWrap.appendChild(ipaSpan);
                    cardContent.appendChild(ipaWrap);
                }
            }

            if (currentStateIdx === 0) {
                displayWordWithIPA(item[0], item[4]);
            } else if (currentStateIdx === 1) {
                appendLines(cardContent, item[1], engColor, false, item[0]);
            } else if (currentStateIdx === 2) {
                displayWordWithIPA(item[0], item[4]);
                
                const divider = document.createElement('div');
                divider.className = 'content-divider';
                cardContent.appendChild(divider);
                
                appendLines(cardContent, item[2], chtColor, false, null, true);
            } else if (currentStateIdx === 3) {
                appendLines(cardContent, item[1], engColor, false, item[0]);
                
                const divider = document.createElement('div');
                divider.className = 'content-divider';
                cardContent.appendChild(divider);
                
                appendLines(cardContent, item[3], chtColor);
            }

            // 底部進度：左側卡片序號、中間 4 階段圓點、右側頁數
            const dotsHTML = [0, 1, 2, 3].map(i =>
                `<span class="step-dot ${i === currentStateIdx ? 'active' : ''}"></span>`
            ).join('');
            cardProgress.innerHTML = `
                <span class="progress-count">${currentWordIdx + 1} / ${wordsData.length}</span>
                <div class="step-dots">${dotsHTML}</div>
                <span class="step-label">第 ${currentStateIdx + 1} / 4 頁</span>
            `;

            if (bottomFill) {
                const progressPct = ((currentWordIdx * 4 + currentStateIdx + 1) / (wordsData.length * 4)) * 100;
                bottomFill.style.width = `${progressPct}%`;
            }

            // 渲染右上角標籤與發音按鈕
            const oldTopRight = cardElement.querySelectorAll('.card-top-right');
            oldTopRight.forEach(t => t.remove());

            const topRightContainer = document.createElement('div');
            topRightContainer.className = 'card-top-right';

            if (item[5]) {
                const tags = item[5].split(',');
                tags.forEach(tag => {
                    const cleanTag = tag.trim();
                    if (!cleanTag) return;
                    const tagSpan = document.createElement('span');
                    tagSpan.className = `tag-pill tag-${cleanTag}`;
                    tagSpan.textContent = cleanTag;
                    topRightContainer.appendChild(tagSpan);
                });
            }

            const speakBtn = document.createElement('button');
            speakBtn.className = 'speak-btn';
            speakBtn.title = '朗讀發音 (快捷鍵 S)';
            speakBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>`;
            speakBtn.addEventListener('click', speakCurrentText);
            topRightContainer.appendChild(speakBtn);

            cardElement.appendChild(topRightContainer);

            // 根據單字索引更換卡片背景顏色
            cardElement.style.background = cardBgColors[currentWordIdx % cardBgColors.length];

            // 字體粗細與對齊設定
            cardContent.style.fontWeight = currentStateIdx === 0 ? "700" : "500";
            
            // 只有英文例句和英文例句翻譯靠左對齊，其餘維持置中
            if (currentStateIdx === 1 || currentStateIdx === 3) {
                cardContent.style.textAlign = "left";
            } else {
                cardContent.style.textAlign = "center";
            }

            // 設定預設字體大小，並針對手機版做出對應
            const isMobile = window.innerWidth <= 600;
            let currentSize = currentStateIdx === 0 ? (isMobile ? 48 : 72) : (isMobile ? 24 : 32);
            cardContent.style.fontSize = currentSize + "px";

            // 文字太多時自動依卡片大小縮小字體
            const maxContentHeight = cardElement.clientHeight - 110;
            while (cardContent.scrollHeight > maxContentHeight && currentSize > 14) {
                currentSize--;
                cardContent.style.fontSize = currentSize + "px";
            }
            
            // 檢查水平溢出（避免單字太長被斷行）
            if (currentStateIdx === 0 || currentStateIdx === 2) {
                cardContent.style.whiteSpace = "nowrap";
                const cs = window.getComputedStyle(cardElement);
                const maxContentWidth = cardElement.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
                while (cardContent.scrollWidth > maxContentWidth && currentSize > 12) {
                    currentSize--;
                    cardContent.style.fontSize = currentSize + "px";
                }
                cardContent.style.whiteSpace = "normal"; // 恢復
            }
            triggerAutoFlip();
        }

        // 當視窗大小改變時重新渲染以調整字體
        window.addEventListener('resize', render);

        document.getElementById('csvFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                loadCSVText(evt.target.result);
            };
            reader.readAsText(file);
        });

        let isAnimating = false;
        
        function animateCard(direction, stateChangeCallback) {
            if (isAnimating) return;
            isAnimating = true;
            
            const card = document.getElementById('card');
            const container = card.parentElement;
            
            // 建立外層遮罩容器，確保刷頁動畫與掃描線不會超出卡片圓角
            const wrapper = document.createElement('div');
            wrapper.className = 'kindle-wipe-wrapper';
            
            // 複製當前卡片作為「舊頁面」覆蓋在上方
            const oldCard = card.cloneNode(true);
            oldCard.removeAttribute('id');
            oldCard.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
            oldCard.classList.add('card-wipe-overlay');
            oldCard.style.clipPath = 'inset(0 0% 0 0%)';
            
            // 建立模擬 Kindle 電子紙刷頁交界處的掃描過渡線
            const sweepLine = document.createElement('div');
            sweepLine.className = 'kindle-sweep-line';
            sweepLine.style.left = direction === 'next' ? '100%' : '0%';
            if (direction === 'next') {
                sweepLine.style.transform = 'translateX(-50%) scaleX(-1)';
            }
            
            wrapper.appendChild(oldCard);
            wrapper.appendChild(sweepLine);
            container.appendChild(wrapper);
            
            // 底層真實卡片立即更新為「新頁面」內容
            stateChangeCallback();
            render();
            
            // 強制瀏覽器重繪，確保初始遮罩位置生效
            void wrapper.offsetWidth;
            
            // 啟動漸進刷頁動畫：next 由右到左揭露新頁，prev 由左到右揭露新頁
            const duration = 340;
            const easing = 'cubic-bezier(0.4, 0, 0.2, 1)';
            oldCard.style.transition = `clip-path ${duration}ms ${easing}`;
            sweepLine.style.transition = `left ${duration}ms ${easing}`;
            
            if (direction === 'next') {
                oldCard.style.clipPath = 'inset(0 100% 0 0%)';
                sweepLine.style.left = '0%';
            } else {
                oldCard.style.clipPath = 'inset(0 0% 0 100%)';
                sweepLine.style.left = '100%';
            }
            
            setTimeout(() => {
                wrapper.remove();
                isAnimating = false;
            }, duration);
        }

        let randomHistory = [];

        function nextPage() {
            if (wordsData.length === 0 || isAnimating) return;
            const isRandom = document.getElementById('random-switch').checked;
            
            let willUpdate = true;
            if (currentStateIdx === 3 && !isRandom && currentWordIdx >= wordsData.length - 1) {
                willUpdate = false;
            }
            if (!willUpdate) return;

            animateCard('next', () => {
                if (currentStateIdx < 3) {
                    currentStateIdx++;
                } else {
                    if (isRandom) {
                        randomHistory.push(currentWordIdx); // 記錄歷史，以便上一頁能返回
                        currentWordIdx = Math.floor(Math.random() * wordsData.length);
                        currentStateIdx = 0;
                    } else {
                        currentWordIdx++;
                        currentStateIdx = 0;
                    }
                }
            });
        }

        function prevPage() {
            if (wordsData.length === 0 || isAnimating) return;
            const isRandom = document.getElementById('random-switch').checked;

            let willUpdate = true;
            if (currentStateIdx === 0) {
                if (isRandom && randomHistory.length === 0) willUpdate = false;
                if (!isRandom && currentWordIdx === 0) willUpdate = false;
            }
            if (!willUpdate) return;

            animateCard('prev', () => {
                if (currentStateIdx > 0) {
                    currentStateIdx--;
                } else {
                    if (isRandom) {
                        currentWordIdx = randomHistory.pop();
                        currentStateIdx = 3;
                    } else {
                        currentWordIdx--;
                        currentStateIdx = 3;
                    }
                }
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextPage();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevPage();
            } else if (e.key === 's' || e.key === 'S') {
                speakCurrentText();
            }
        });

        // 手機版與電腦版點擊卡片左右兩側翻頁
        document.getElementById('card').addEventListener('click', (e) => {
            if (e.target.closest('.speak-btn')) return;
            const rect = document.getElementById('card').getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (clickX > rect.width / 2) {
                nextPage();
            } else {
                prevPage();
            }
        });

        async function init() {
            // 首先檢查是否已經有透過 Python 寫入的內嵌資料
            let embeddedData = document.getElementById('csv-data').innerHTML;
            embeddedData = embeddedData.replace(/\/\*CSV_START\*\//g, '').replace(/\/\*CSV_END\*\//g, '').trim();
            
            if (embeddedData.length > 0) {
                loadCSVText(embeddedData);
                return;
            }

            // 如果沒有內嵌資料，嘗試自動 fetch
            try {
                const response = await fetch('words.csv');
                if (!response.ok) throw new Error("Network response error");
                const text = await response.text();
                loadCSVText(text);
            } catch (e) {
                document.getElementById('file-picker-container').style.display = 'block';
            }
        }

        let autoFlipInterval = null;
        let remainingSeconds = 0;
        const stateDurations = [5, 8, 6, 8];
        
        function updateTimerDisplay() {
            const timerEl = document.getElementById('auto-timer');
            if (!timerEl) return;
            
            const autoSwitch = document.getElementById('auto-switch');
            if (autoSwitch && autoSwitch.checked) {
                timerEl.style.display = 'inline';
                timerEl.textContent = `· ${remainingSeconds}s`;
            } else {
                timerEl.style.display = 'none';
            }
        }

        function triggerAutoFlip() {
            clearInterval(autoFlipInterval);
            const autoSwitch = document.getElementById('auto-switch');
            if (autoSwitch && autoSwitch.checked && wordsData.length > 0) {
                remainingSeconds = stateDurations[currentStateIdx];
                updateTimerDisplay();
                
                autoFlipInterval = setInterval(() => {
                    remainingSeconds--;
                    if (remainingSeconds <= 0) {
                        clearInterval(autoFlipInterval);
                        nextPage();
                    } else {
                        updateTimerDisplay();
                    }
                }, 1000);
            } else {
                updateTimerDisplay();
            }
        }
        
        document.getElementById('auto-switch').addEventListener('change', () => {
            triggerAutoFlip();
        });
        
        function applyFilters() {
            const checkboxes = document.querySelectorAll('label.switch-label input[value]');
            const checkedTags = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
            
            if (checkedTags.length === 0) {
                wordsData = [];
            } else {
                wordsData = originalWordsData.filter(row => {
                    const rowTags = row[5] ? row[5].split(',').map(t => t.trim()) : ['Life'];
                    return rowTags.some(tag => checkedTags.includes(tag));
                });
            }

            currentWordIdx = 0;
            currentStateIdx = 0;
            randomHistory = []; // Reset random history on filter change
            
            if (wordsData.length > 0) {
                document.getElementById('card').style.display = 'flex';
                render();
            } else {
                document.getElementById('card').style.display = 'none';
                alert('沒有符合條件的單字！');
            }
        }

        // Add event listeners to filter checkboxes
        document.querySelectorAll('label.switch-label input[value]').forEach(cb => {
            cb.addEventListener('change', applyFilters);
        });

        init();
    </script>
</body>
