<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>單字卡 (Words Flashcards)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50; /* 深色背景 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            touch-action: manipulation; /* 停用點擊兩下放大，提升手機操作手感 */
        }
        .card-container {
            width: 800px;
            max-width: 90%;
            height: 60vh;
            min-height: 300px;
            position: relative;
        }
        .card {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06); /* 更柔和的陰影 */
            transition: background-color 0.4s ease; /* 增加背景顏色漸變效果 */
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 80px; /* 增加左右留白 */
            box-sizing: border-box;
            text-align: center;
            position: relative;
            cursor: pointer;
            user-select: none; /* 防止快速點擊時反白文字 */
        }
        .title {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #888;
            font-size: 14px;
            font-weight: bold;
        }
        .progress {
            position: absolute;
            bottom: 15px;
            color: #aaa;
            font-size: 14px;
        }
        .content {
            font-size: 32px;
            color: #333;
            line-height: 1.5;
            white-space: pre-line;
            word-break: break-word;
            width: 100%;
        }
        .instructions {
            margin-top: 20px;
            color: #e2e8f0;
            font-size: 14px;
            text-align: center;
            padding: 0 10px;
            line-height: 1.6;
        }
        .controls {
            margin-bottom: 20px;
            color: #333;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .switch-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            background: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .switch-label input {
            margin-right: 8px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }
        #file-picker-container {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        #file-picker-container h2 {
            margin-top: 0;
            color: #333;
            font-size: 20px;
        }
        input[type="file"] {
            margin-top: 20px;
            font-size: 16px;
            max-width: 100%;
        }
        /* 手機版適配：當螢幕寬度小於 600px 時縮小字體 */
        @media (max-width: 600px) {
            .card {
                padding: 40px 30px; /* 手機上縮小左右留白以免文字太擠 */
            }
            .title, .progress {
                font-size: 12px;
            }
        }
    </style>
</head>

    <div class="controls">
        <label class="switch-label">
            <input type="checkbox" id="random-switch">
            隨機單字模式
        </label>
    </div>

    <div class="card-container">
        
        <div id="file-picker-container">
            <h2>需要載入資料</h2>
            <p>由於目前無內嵌資料，也無法自動讀取本機檔案。</p>
            <p>請先執行 python 腳本更新檔案，或手動選擇 <b>words.csv</b>：</p>
            <input type="file" id="csvFileInput" accept=".csv" />
        </div>

        <div class="card" id="card">
            <div class="title" id="card-title">標題</div>
            <div class="content" id="card-content">內容</div>
            <div class="progress" id="card-progress">進度</div>
        </div>

    </div>

    <div class="instructions">
        👉 <b>操作說明：</b><br>
        💻 <b>電腦版：</b> 按鍵盤 <b>右鍵 (→)</b> 翻頁， <b>左鍵 (←)</b> 回前頁<br>
        📱 <b>手機版：</b> 點擊卡片 <b>右半邊</b> 翻頁，點擊 <b>左半邊</b> 回前頁
    </div>

    <script>
        let wordsData = [];
        let currentWordIdx = 0;
        let currentStateIdx = 0;

        const stateTitles = ["1", "2", "3", "4"];
        
        // 柔和的卡片背景顏色，每次換單字時循環使用
        const cardBgColors = [
            "#fdf1d4", // 暖黃
            "#e6f4ea", // 薄荷綠
            "#e8f0fe", // 淺藍
            "#fce8e6", // 淺粉
            "#f3e8fd", // 淺紫
            "#ffe8d6"  // 柔和橘
        ];

        function parseCSV(str) {
            const arr = [];
            let quote = false;
            let row = 0;
            let col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';

                if (cc === '"' && quote && nc === '"') {
                    arr[row][col] += cc; ++c; continue;
                }
                if (cc === '"') {
                    quote = !quote; continue;
                }
                if (cc === ',' && !quote) {
                    ++col; continue;
                }
                if (cc === '\r' && nc === '\n' && !quote) {
                    ++row; col = 0; ++c; continue;
                }
                if (cc === '\n' && !quote) {
                    ++row; col = 0; continue;
                }
                if (cc === '\r' && !quote) {
                    ++row; col = 0; continue;
                }
                arr[row][col] += cc;
            }
            // 將字串中的 literal '\n' 轉換為真實換行符號，讓 CSV 可以是單行
            return arr.map(r => r.map(cell => cell.replace(/\\n/g, '\n')));
        }

        function loadCSVText(text) {
            const arr = parseCSV(text);
            wordsData = arr.filter(row => row.length >= 4 && row[0].trim() !== '');
            
            if (wordsData.length > 0 && wordsData[0][0] === '英文單字') {
                wordsData.shift(); 
            }

            if (wordsData.length > 0) {
                document.getElementById('file-picker-container').style.display = 'none';
                document.getElementById('card').style.display = 'flex';
                render();
            } else {
                alert("找不到單字資料或格式錯誤！");
            }
        }

        function render() {
            if (wordsData.length === 0) return;
            const item = wordsData[currentWordIdx];
            const cardElement = document.getElementById('card');
            const cardTitle = document.getElementById('card-title');
            const cardContent = document.getElementById('card-content');
            const cardProgress = document.getElementById('card-progress');

            cardTitle.innerText = '';
            // 清空舊內容
            cardContent.innerHTML = '';
            
            // 輔助函數：將文字以 div 方式附加，若有多行則套用小圓點與縮排對齊
            function appendLines(container, text, color, forceNoBullet = false) {
                text = text.trim();
                const lines = text.split('\n').filter(line => line.trim() !== '');
                // 如果文字超過一行，且沒有強制關閉符號，則加上小圓點
                const useBullet = lines.length > 1 && !forceNoBullet;
                
                lines.forEach(line => {
                    const div = document.createElement('div');
                    div.style.color = color;
                    if (useBullet) {
                        // 使用 Flexbox 確保小圓點和多行文字完美對齊
                        div.style.display = "flex";
                        div.style.alignItems = "flex-start"; // 讓圓點對齊第一行
                        
                        if (currentStateIdx === 2 || currentStateIdx === 0) {
                            div.style.justifyContent = "center"; // 置中頁面的處理
                        }
                        
                        const bullet = document.createElement('span');
                        bullet.textContent = '•';
                        bullet.style.marginRight = '0.5em'; // 圓點與文字的間距
                        bullet.style.flexShrink = '0'; // 防止圓點被壓縮
                        
                        const txt = document.createElement('span');
                        txt.textContent = line.trim();
                        txt.style.textAlign = "left"; // 確保換行後的文字靠左對齊
                        
                        div.appendChild(bullet);
                        div.appendChild(txt);
                    } else {
                        div.textContent = line.trim();
                    }
                    container.appendChild(div);
                });
            }

            const engColor = "#1a202c"; // 較深的黑色
            const chtColor = "#2b6cb0"; // 稍微帶點藍色以區別中文翻譯

            // 輔助函數：顯示單字與音標
            function displayWordWithIPA(wordText, ipaText) {
                appendLines(cardContent, wordText, engColor, true);
                if (ipaText && ipaText.trim() !== '') {
                    const ipaDiv = document.createElement('div');
                    ipaDiv.style.color = "#718096"; // 較淺的灰色
                    ipaDiv.style.fontSize = "0.6em"; // 縮小音標字體
                    ipaDiv.style.marginTop = "8px";
                    ipaDiv.style.fontWeight = "normal";
                    ipaDiv.style.textAlign = "center";
                    ipaDiv.textContent = ipaText.trim();
                    cardContent.appendChild(ipaDiv);
                }
            }

            if (currentStateIdx === 0) {
                displayWordWithIPA(item[0], item[4]);
            } else if (currentStateIdx === 1) {
                appendLines(cardContent, item[1], engColor);
            } else if (currentStateIdx === 2) {
                displayWordWithIPA(item[0], item[4]);
                
                const gap = document.createElement('div');
                gap.style.height = "1em";
                cardContent.appendChild(gap);
                
                appendLines(cardContent, item[2], chtColor);
            } else if (currentStateIdx === 3) {
                appendLines(cardContent, item[1], engColor);
                
                const gap = document.createElement('div');
                gap.style.height = "1em";
                cardContent.appendChild(gap);
                
                appendLines(cardContent, item[3], chtColor);
            }
            cardProgress.innerText = `${currentWordIdx + 1} / ${wordsData.length}  |  第 ${currentStateIdx + 1} 頁`;

            // 根據單字索引更換卡片背景顏色
            cardElement.style.backgroundColor = cardBgColors[currentWordIdx % cardBgColors.length];

            // 字體粗細與對齊設定
            cardContent.style.fontWeight = currentStateIdx === 0 ? "bold" : "normal";
            
            // 只有英文例句和英文例句翻譯靠左對齊，其餘維持置中
            if (currentStateIdx === 1 || currentStateIdx === 3) {
                cardContent.style.textAlign = "left";
            } else {
                cardContent.style.textAlign = "center";
            }

            // 設定預設字體大小，並針對手機版做出對應
            const isMobile = window.innerWidth <= 600;
            let currentSize = currentStateIdx === 0 ? (isMobile ? 48 : 72) : (isMobile ? 24 : 32);
            cardContent.style.fontSize = currentSize + "px";

            // 文字太多時自動依卡片大小縮小字體
            // 預留標題與進度條的空間 (扣除約 100px)
            const maxContentHeight = cardElement.clientHeight - 100;
            while (cardContent.scrollHeight > maxContentHeight && currentSize > 14) {
                currentSize--;
                cardContent.style.fontSize = currentSize + "px";
            }
        }

        // 當視窗大小改變時重新渲染以調整字體
        window.addEventListener('resize', render);

        document.getElementById('csvFileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                loadCSVText(evt.target.result);
            };
            reader.readAsText(file);
        });

        let randomHistory = [];

        function nextPage() {
            if (wordsData.length === 0) return;
            const isRandom = document.getElementById('random-switch').checked;
            
            if (currentStateIdx < 3) {
                currentStateIdx++;
            } else {
                if (isRandom) {
                    randomHistory.push(currentWordIdx); // 記錄歷史，以便上一頁能返回
                    currentWordIdx = Math.floor(Math.random() * wordsData.length);
                    currentStateIdx = 0;
                } else {
                    if (currentWordIdx < wordsData.length - 1) {
                        currentWordIdx++;
                        currentStateIdx = 0;
                    } else {
                        return; 
                    }
                }
            }
            render();
        }

        function prevPage() {
            if (wordsData.length === 0) return;
            const isRandom = document.getElementById('random-switch').checked;

            if (currentStateIdx > 0) {
                currentStateIdx--;
            } else {
                if (isRandom) {
                    if (randomHistory.length > 0) {
                        currentWordIdx = randomHistory.pop();
                        currentStateIdx = 3;
                    } else {
                        return; // 如果沒有歷史紀錄，就停在第一頁不動
                    }
                } else {
                    if (currentWordIdx > 0) {
                        currentWordIdx--;
                        currentStateIdx = 3;
                    } else {
                        return;
                    }
                }
            }
            render();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            else if (e.key === 'ArrowLeft') prevPage();
        });

        // 手機版點擊螢幕左右兩側
        document.getElementById('card').addEventListener('click', (e) => {
            const rect = document.getElementById('card').getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (clickX > rect.width / 2) {
                nextPage();
            } else {
                prevPage();
            }
        });

        async function init() {
            // 首先檢查是否已經有透過 Python 寫入的內嵌資料
            let embeddedData = document.getElementById('csv-data').innerHTML;
            embeddedData = embeddedData.replace(/\/\*CSV_START\*\//g, '').replace(/\/\*CSV_END\*\//g, '').trim();
            
            if (embeddedData.length > 0) {
                loadCSVText(embeddedData);
                return;
            }

            // 如果沒有內嵌資料，嘗試自動 fetch
            try {
                const response = await fetch('words.csv');
                if (!response.ok) throw new Error("Network response error");
                const text = await response.text();
                loadCSVText(text);
            } catch (e) {
                document.getElementById('file-picker-container').style.display = 'block';
            }
        }

        init();
    </script>
</body>
</html>
